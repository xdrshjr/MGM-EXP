[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*

# Explicit Windows-only selection; pytest.ini still runs the complete suite.
# Bash requires os.setsid and /bin/bash. These three tests require GNU find
# or POSIX path semantics. Run all of them under Linux for full verification.
addopts =
    -v
    --ignore=tests/test_bash_tool.py
    --deselect=tests/test_edit_tool.py::TestEditorTool::test_view_directory
    --deselect=tests/test_edit_tool.py::TestEditorTool::test_invalid_path
    --deselect=tests/test_polyglot_harness.py::test_runtime_env_exposes_testbed_python_and_host_rust
